version: "3.9"
services:
  mongo_pagos:
    image: mongo:7
    container_name: mongo_pagos
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  pagos:
    build: .
    container_name: servicio_pagos
    env_file: .env
    depends_on:
      - mongo_pagos
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - pagos

volumes:
  mongo_data:
