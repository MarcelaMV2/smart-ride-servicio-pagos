[package]
name = "smart-ride-servicio-pagos"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mongodb = { version = "2.8", features = ["tokio-runtime"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }

utoipa = { version = "4", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "4", features = ["actix-web"] }

log = "0.4"
env_logger = "0.11"
