[package]
name = "servicio-pagos"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
mongodb = { version = "2.8", default-features = false, features = ["sync", "tokio-runtime"] }
bson = "2.11"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
thiserror = "1"

# Swagger
utoipa = { version = "4", features = ["chrono", "uuid", "actix_extras"] }
utoipa-swagger-ui = { version = "7", features = ["actix-web"] }

# Logs
env_logger = "0.11"
log = "0.4"
