services:
  # MongoDB para Pagos
  mongo-pagos:
    image: mongo:latest
    container_name: pagos-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: usuario
      MONGO_INITDB_ROOT_PASSWORD: usuario123
      MONGO_INITDB_DATABASE: smart_ride_pagos
    ports:
      - "27018:27017"
    volumes:
      - mongo_pagos_data:/data/db
    networks:
      - pagos-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Servicio de Pagos (Rust)
  pagos-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-ride-servicio-pagos
    restart: unless-stopped
    depends_on:
      mongo-pagos:
        condition: service_healthy
    environment:
      # MongoDB
      MONGO_URI: mongodb://usuario:usuario123@mongo-pagos:27017
      MONGO_DB: smart_ride_pagos
      MONGO_COL: pagos
      
      # Server
      SERVER_PORT: 4000
      
      # Rust
      RUST_LOG: info
      RUST_BACKTRACE: 1
    ports:
      - "4000:4000"
    networks:
      - pagos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_pagos_data:
    driver: local

networks:
  pagos-network:
    name: smart-ride-pagos-network
    driver: bridge
